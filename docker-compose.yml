services:
  wiki-sync:
    image: alpine/git:latest
    container_name: wiki-tvbox-sync
    restart: unless-stopped
    entrypoint: /bin/sh
    command: >
      -c "while true; do
            if [ -d /dest/.git ]; then
              cd /dest && git fetch --all -q && git reset --hard origin/main -q;
            else
              rm -rf /dest/* /dest/.[!.]* 2>/dev/null;
              git clone -q https://github.com/jonathanbrum/servidor-tv-box.git /dest;
            fi;
            sleep 60;
          done"
    volumes:
      - /DATA/AppData/pocketbase/pb_public/wiki:/dest
