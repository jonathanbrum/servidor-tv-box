name: wiki-tv-box
services:
  wiki-sync:
    image: alpine/git:latest
    container_name: wiki-tvbox-sync
    restart: unless-stopped
    entrypoint: /bin/sh
    command: >
      -c "while true; do
            if [ -d /dest/.git ]; then
              cd /dest && git fetch --all -q && git reset --hard origin/main -q;
            else
              rm -rf /dest/* /dest/.[!.]* 2>/dev/null;
              git clone -q https://github.com/jonathanbrum/servidor-tv-box.git /dest;
            fi;
            sleep 60;
          done"
    volumes:
      - /DATA/AppData/pocketbase/pb_public/wiki:/dest
    x-casaos:
      icon: https://docsify.js.org/_media/icon.svg
      index: /wiki/
      title:
        en_us: Wiki Docsify
      webui_port: "8090"
x-casaos:
  author: self
  category: self
  hostname: ""
  icon: https://docsify.js.org/_media/icon.svg
  index: /wiki/
  is_uncontrolled: false
  port_map: "8090"
  scheme: http
  title:
    custom: "Wiki Docsify"
    en_us: Wiki Docsify
