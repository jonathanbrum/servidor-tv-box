<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Wiki — Servidor Linux TV Box</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Documentação oficial do Servidor Doméstico Linux (Armbian + CasaOS) em TV Box Allwinner H313">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <style>
    :root {
      --base-font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --code-font-family: 'JetBrains Mono', monospace;
      --base-background-color: #0b0f19;
      --base-color: #e2e8f0;
      --theme-color: #38bdf8;
      --heading-color: #f8fafc;
      --sidebar-background: #070a12;
      --sidebar-width: 280px;
      --sidebar-border-color: #1e293b;
      --sidebar-name-color: #38bdf8;
      --sidebar-name-font-weight: 700;
      --sidebar-nav-link-color: #94a3b8;
      --sidebar-nav-link-color--active: #38bdf8;
      --sidebar-nav-link-color--hover: #f1f5f9;
      --content-max-width: 960px;
      --code-theme-background: #111827;
      --code-inline-background: #1e293b;
      --code-inline-color: #7dd3fc;
      --table-row-odd-background: #0f172a;
      --table-row-even-background: #131c31;
      --table-head-background: #1e293b;
      --table-cell-border-color: #1e293b;
      --blockquote-background: #0f172a;
      --blockquote-border-color: #38bdf8;
      --search-input-background-color: #111827;
      --search-input-border-color: #1e293b;
    }

    body {
      background-color: var(--base-background-color);
      letter-spacing: -0.01em;
    }

    .sidebar {
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.4);
    }

    .markdown-section h1 {
      font-weight: 700;
      letter-spacing: -0.025em;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 0.5rem;
    }

    .markdown-section h2 {
      font-weight: 600;
      color: #f1f5f9;
      margin-top: 2.2rem;
    }

    .markdown-section table {
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #1e293b;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    .markdown-section pre {
      border-radius: 10px !important;
      border: 1px solid #1e293b !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .markdown-section hr {
      border-bottom: 1px solid #1e293b;
    }
  </style>
</head>
<body>
  <div id="app">Carregando a Wiki do Servidor...</div>
  <script>
    window.$docsify = {
      name: '🖥️ Mini-VPS TV Box',
      repo: 'https://github.com/jonathanbrum/servidor-tv-box',
      homepage: 'README.md',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        placeholder: '🔍 Pesquisar na Wiki...',
        noData: 'Nenhum resultado encontrado!'
      },
      copyCode: {
        buttonText: 'Copiar',
        errorText: 'Erro',
        successText: 'Copiado!'
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
</body>
</html>
